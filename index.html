<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="纯前端中国象棋人机对战，支持多档 AI 难度、提示、计时和悔棋。">
  <title>中国象棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="../" aria-label="返回游戏中心"><span aria-hidden="true">←</span><b>游戏中心</b></a>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">帥</span>
      <span>中国象棋</span>
    </div>
    <button id="themeButton" class="icon-button" type="button" aria-label="切换深色模式" title="切换深色模式">◐</button>
  </header>

  <main class="game-layout">
    <section class="board-card" aria-label="中国象棋棋盘区域">
      <div class="player-bar">
        <div class="player-info">
          <span class="player-dot black" aria-hidden="true"></span>
          <span id="blackPlayerLabel" aria-live="polite">黑方（AI）</span>
        </div>
        <div id="blackTimer" class="timer hidden">15:00</div>
      </div>

      <div id="chessboard" class="chess-board"></div>

      <div class="player-bar">
        <div class="player-info">
          <span class="player-dot red" aria-hidden="true"></span>
          <span id="redPlayerLabel" aria-live="polite">红方（玩家）</span>
        </div>
        <div id="redTimer" class="timer red hidden">15:00</div>
      </div>

      <div class="actions board-actions">
        <button id="newGameBtn" class="primary-button" type="button">新游戏</button>
        <button id="undoBtn" class="secondary-button" type="button">悔棋</button>
        <button id="hintBtn" class="secondary-button" type="button">提示<span id="hintCountdown" class="hint-countdown" hidden></span></button>
        <button id="soundBtn" class="secondary-button" type="button">音效</button>
      </div>
    </section>

    <aside class="side-panel">
      <section class="panel status-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">对局信息</p>
            <h1>挑战电脑</h1>
          </div>
        </div>

        <div class="info-row">
          <span>当前回合</span>
          <strong id="currentTurn">红方</strong>
        </div>

        <div class="info-row">
          <span>回合数</span>
          <strong id="moveCount">0</strong>
        </div>

        <label class="field">
          <span>AI 难度</span>
          <select id="difficultySelect">
            <option value="fast">极速</option>
            <option value="standard" selected>标准</option>
            <option value="hard">困难</option>
            <option value="master">大师</option>
          </select>
        </label>

        <label class="switch-row">
          <span class="switch-copy">
            <strong>对局计时</strong>
            <small>每方 15 分钟，默认关闭</small>
          </span>
          <input id="timerToggle" type="checkbox" aria-label="启用每方十五分钟对局计时">
        </label>

        <div class="info-row status-box">
          <span>游戏状态</span>
          <strong id="gameStatus" class="status-value">进行中</strong>
        </div>
      </section>

      <section class="panel history-panel">
        <div class="history-heading">
          <h2>走法历史</h2>
          <span>记录</span>
        </div>
        <div id="moveHistory" class="history-list"></div>
      </section>
    </aside>
  </main>

  <div id="gameOverModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div id="gameOverIcon" class="result-icon" aria-hidden="true"></div>
      <p class="eyebrow">本局结束</p>
      <h2 id="gameOverTitle">你赢了</h2>
      <p id="gameOverMessage"></p>
      <div class="modal-actions">
        <button id="closeModalBtn" class="primary-button" type="button">开始新游戏</button>
      </div>
    </div>
  </div>

  <div id="checkmateUndoModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="checkmateUndoTitle">
    <div class="modal-card">
      <div class="result-icon warning" aria-hidden="true">!</div>
      <p class="eyebrow">红方被将死</p>
      <h2 id="checkmateUndoTitle">红方被将死</h2>
      <p>当前没有可解除将军的走法，是否悔棋？</p>
      <div class="modal-actions">
        <button id="checkmateEndBtn" class="secondary-button" type="button">结束对局</button>
        <button id="checkmateUndoBtn" class="primary-button" type="button">悔棋</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js?v=20260824-checkmate2"></script>
</body>
</html>
